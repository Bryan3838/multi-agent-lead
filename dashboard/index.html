<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent control room</title>
<style>
/* Claude's palette: warm paper and ink, one terracotta accent; status colours are used only on small marks */
:root{
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,Menlo,monospace;
  --fs-xs:11px;--fs-s:12px;--fs-m:13px;--fs-l:14px;--fs-xl:16px;
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;
  --r-s:6px;--r:8px;--r-l:12px;
  --bg:#faf9f5;--sunk:#f5f4ee;--panel:#fff;--panel2:#f0eee6;--hover:#f0eee6;
  --text:#141413;--text2:#3d3d3a;--muted:#73726c;--faint:#a3a199;--line:#e8e6dc;--line2:#d4d1c5;
  --accent:#c96442;--accent-bg:#f6e8e2;
  --run:#c96442;--run-bg:#f6e8e2;--done:#5a7d3f;--done-bg:#e8eedf;--fail:#b8403a;--fail-bg:#f7e2df;
  --idle:#a16f12;--idle-bg:#f6ecd5;--stop:#8a887f;--stop-bg:#eeece4;--pend:#a3a199;--pend-bg:#f0eee6;--on-solid:#fff;
  --m-opus:#c96442;--m-sonnet:#8c8473;--m-haiku:#c9c2b0;--m-other:#e0dcd0;
  --shadow:0 1px 2px rgba(20,20,19,.05),0 8px 24px rgba(20,20,19,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624;--sunk:#1f1e1d;--panel:#30302e;--panel2:#353432;--hover:#353432;
  --text:#faf9f5;--text2:#c3c1b8;--muted:#9c9a92;--faint:#6c6a64;--line:#3a3936;--line2:#4b4a45;
  --accent:#d97757;--accent-bg:rgba(217,119,87,.16);
  --run:#d97757;--run-bg:rgba(217,119,87,.16);--done:#93b77a;--done-bg:rgba(147,183,122,.14);--fail:#e5786f;--fail-bg:rgba(229,120,111,.15);
  --idle:#d6a64f;--idle-bg:rgba(214,166,79,.15);--stop:#9c9a92;--stop-bg:rgba(156,154,146,.14);--pend:#6c6a64;--pend-bg:#353432;--on-solid:#1f1e1d;
  --m-opus:#d97757;--m-sonnet:#a89f8c;--m-haiku:#6f6a5e;--m-other:#4b4a45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#262624;--sunk:#1f1e1d;--panel:#30302e;--panel2:#353432;--hover:#353432;
  --text:#faf9f5;--text2:#c3c1b8;--muted:#9c9a92;--faint:#6c6a64;--line:#3a3936;--line2:#4b4a45;
  --accent:#d97757;--accent-bg:rgba(217,119,87,.16);
  --run:#d97757;--run-bg:rgba(217,119,87,.16);--done:#93b77a;--done-bg:rgba(147,183,122,.14);--fail:#e5786f;--fail-bg:rgba(229,120,111,.15);
  --idle:#d6a64f;--idle-bg:rgba(214,166,79,.15);--stop:#9c9a92;--stop-bg:rgba(156,154,146,.14);--pend:#6c6a64;--pend-bg:#353432;--on-solid:#1f1e1d;
  --m-opus:#d97757;--m-sonnet:#a89f8c;--m-haiku:#6f6a5e;--m-other:#4b4a45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
[hidden]{display:none!important}
html{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-m)/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
body.open{overflow:hidden}
::selection{background:var(--accent-bg)}
code,.mono{font-family:var(--mono);font-size:var(--fs-s)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[role="button"]{cursor:pointer}
[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--r-s)}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.ic .f{fill:currentColor;stroke:none}
.muted{color:var(--muted)}.small{font-size:var(--fs-s)}
.err{color:var(--fail);font-size:var(--fs-s);overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* header: one row of title, counts, usage and the page tools */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:var(--sp2) var(--sp4);display:flex;flex-wrap:wrap;gap:var(--sp2) var(--sp5);align-items:center;min-height:48px}
@media (max-height:760px){header{position:static}}
.hid{display:flex;align-items:baseline;gap:var(--sp2);min-width:0}
h1{font-size:var(--fs-l);font-weight:600;margin:0;white-space:nowrap;line-height:1.3}
.sub{color:var(--muted);font-size:var(--fs-s)}
#meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.age.stale{color:var(--idle)}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp1) var(--sp3);font-size:var(--fs-s);color:var(--muted)}
.stat{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.stat b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.stat .dot{width:7px;height:7px}
.stat .ic{width:13px;height:13px}
.stat.zero{display:none}
.stat.warn,.stat.warn b{color:var(--idle)}
.stat.bad,.stat.bad b{color:var(--fail)}
.vsep{width:1px;height:14px;background:var(--line2)}
.hright{display:flex;align-items:center;gap:var(--sp2) var(--sp4);margin-left:auto;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.bars{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp1) var(--sp4);min-width:0;margin-left:auto}
.bar{display:grid;grid-template-columns:auto 56px auto auto;align-items:center;gap:0 var(--sp2);font-size:var(--fs-s);color:var(--muted);white-space:nowrap}
.bar .track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:var(--muted)}
.bar .pc{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums;text-align:right;min-width:3ch}
.bar .rs{display:inline-flex;align-items:center;gap:3px;color:var(--faint);font-variant-numeric:tabular-nums}
.bar .rs .ic{width:11px;height:11px}
.bar.warn .fill{background:var(--idle)}.bar.warn .pc{color:var(--idle)}
.bar.hot .fill{background:var(--fail)}.bar.hot .pc{color:var(--fail)}
.bars .sub{display:inline-flex;align-items:center;gap:4px;color:var(--idle);white-space:nowrap}
.bars .sub.none{color:var(--faint)}
.bars .sub .ic{width:13px;height:13px}
.tools{display:flex;gap:2px;align-items:center}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;min-width:28px;padding:0 var(--sp2);border:0;background:none;border-radius:var(--r-s);color:var(--muted);font-size:var(--fs-s);white-space:nowrap}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn.ico{padding:0;width:28px}
.projsel{font:inherit;font-size:var(--fs-s);color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);height:28px;padding:0 var(--sp2);max-width:220px;text-overflow:ellipsis}
.banner{display:flex;align-items:center;gap:var(--sp2);margin:var(--sp2) var(--sp4) 0;padding:6px var(--sp3);border-radius:var(--r);background:var(--fail-bg);color:var(--fail);font-size:var(--fs-s)}
.banner.info{background:var(--idle-bg);color:var(--idle)}

/* page grid: the tree on the left, the side column on the right */
main{padding:var(--sp3) var(--sp4) var(--sp4);display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp4);margin:0 auto}
@media (min-width:1050px){
  body{display:flex;flex-direction:column;height:100vh}
  header,#banners{flex:none}
  header{position:static}
  main{flex:1 1 auto;width:100%;min-height:420px;padding-bottom:var(--sp3);grid-template-columns:minmax(0,1fr) 18px clamp(260px,var(--side-w,370px),calc(60% - 18px));grid-template-rows:minmax(0,1fr);column-gap:0;align-items:stretch}
  main>section{display:flex;flex-direction:column;min-height:0}
  main>section>#treeView{flex:1 1 auto;height:auto;min-height:0}
  main>aside{display:flex;flex-direction:column;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 4px 8px 2px;margin:0 -4px 0 -2px}
  #needPanel.quiet{order:1}
  main>aside.custom>#needPanel.quiet{order:0}
  #colDiv{display:flex;position:relative;min-height:0;justify-content:center;align-items:center;cursor:col-resize;touch-action:none;border-radius:var(--r-s)}
}
.toolrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp2) var(--sp3);margin-bottom:var(--sp2)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp2) var(--sp3)}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--panel2);border-radius:var(--r)}
.filters button{border:0;background:none;border-radius:var(--r-s);height:24px;padding:0 10px;font-size:var(--fs-s);color:var(--muted)}
.filters button:hover{color:var(--text)}
.filters button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.05)}
#laneCount{color:var(--faint);font-variant-numeric:tabular-nums}
.row{display:flex;gap:var(--sp2);align-items:center;flex-wrap:wrap}

/* status marks: a dot (or square, ring, tick) carries the colour; text stays neutral */
.dot{width:8px;height:8px;border-radius:50%;background:var(--pend);flex:none}
.dot.running{background:var(--run);animation:dotpulse 1.8s ease-in-out infinite}
.dot.done{background:var(--done)}.dot.failed{background:var(--fail)}.dot.idle{background:var(--idle)}
.dot.stopped,.dot.killed{background:var(--stop);border-radius:2px}
.dot.pending,.dot.skipped{background:none;box-shadow:inset 0 0 0 1.5px var(--pend)}
@keyframes dotpulse{0%,100%{box-shadow:0 0 0 0 var(--run-bg)}50%{box-shadow:0 0 0 3px var(--run-bg)}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-s);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pend);flex:none}
.pill.running{color:var(--run)}.pill.running::before{background:var(--run)}
.pill.done::before,.pill.pass::before{background:var(--done)}
.pill.failed,.pill.fail{color:var(--fail)}.pill.failed::before,.pill.fail::before{background:var(--fail)}
.pill.idle{color:var(--idle)}.pill.idle::before{background:var(--idle)}
.pill.killed::before,.pill.stopped::before{background:var(--stop);border-radius:2px}
.pill.pending::before,.pill.na::before{background:none;box-shadow:inset 0 0 0 1.5px var(--pend)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-s);font-size:var(--fs-xs);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pend);flex:none}
.chip.running{color:var(--text);border-color:var(--run)}.chip.running::before{background:var(--run);animation:pulse 1.8s ease-in-out infinite}
.chip.done::before{background:var(--done)}
.chip.failed{color:var(--fail);border-color:var(--fail)}.chip.failed::before{background:var(--fail)}
.chip.idle{border-color:var(--idle)}.chip.idle::before{background:var(--idle)}
.chip.stopped::before,.chip.killed::before{background:var(--stop);border-radius:1px}
.chip.skipped,.chip.pending{border-style:dashed}.chip.skipped::before,.chip.pending::before{background:none;box-shadow:inset 0 0 0 1.5px var(--pend)}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.chip.running::before,.dot.running{animation:none}}
.badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-s);border:1px solid var(--line);font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.eta{border-color:transparent;padding:0;color:var(--muted)}
.badge.bare{border-style:dashed}
.git{margin-top:var(--sp1);font-size:var(--fs-s);color:var(--muted)}

/* side column: flat sections with a quiet label, like the app's own side panes */
.panel{position:relative;flex-shrink:0;display:flex;flex-direction:column;padding:10px var(--sp1) var(--sp3);border-bottom:1px solid var(--line)}
.panel>.ph{display:flex;align-items:center;gap:2px;margin:0 0 6px;min-height:22px}
.panel h2{flex:1;min-width:0;margin:0;font-size:var(--fs-s);font-weight:500;color:var(--muted);display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.cnt{color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.cnt.hot{color:var(--fail);font-weight:600}
.panel>.pbody{min-height:0}
.panel.sized>.pbody{flex:1 1 auto;overflow:auto;overscroll-behavior:contain;padding:0 2px 0 0}
.panel.sized .events,.panel.sized #wts{max-height:none;overflow:visible}
.panel.folded>.pbody,.panel.folded>.rsz{display:none}
.panel.folded>.ph{margin-bottom:0}
.pbtn{flex:none;border:0;background:none;color:var(--faint);border-radius:var(--r-s);padding:0;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.pbtn:hover{background:var(--hover);color:var(--text)}
.pbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pbtn.grip{cursor:grab;touch-action:none;margin-left:-6px}
.pbtn.grip svg{fill:currentColor;stroke:none;width:12px;height:12px}
.pbtn[aria-disabled="true"]{opacity:.4;cursor:default}
.pbtn[aria-disabled="true"]:hover{background:none;color:var(--faint)}
.pbtn.fold svg{transition:transform .12s}
.panel.folded .pbtn.fold svg{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){.pbtn.fold svg{transition:none}}
@media (hover:hover) and (pointer:fine) and (min-width:701px){
  .pbtn.pmv,.pbtn.grip{opacity:0;transition:opacity .12s}
  .panel:hover .pbtn.pmv,.panel:focus-within .pbtn.pmv,.panel:hover .pbtn.grip,.panel:focus-within .pbtn.grip{opacity:1}
  .panel:hover .pbtn.pmv[aria-disabled="true"],.panel:focus-within .pbtn.pmv[aria-disabled="true"]{opacity:.4}
}
.rsz{position:absolute;left:12px;right:12px;bottom:-7px;height:14px;cursor:ns-resize;touch-action:none;z-index:2;display:flex;align-items:center;justify-content:center;border-radius:var(--r-s)}
.rsz::before{content:"";width:24px;height:3px;border-radius:2px;background:var(--line2);opacity:0;transition:opacity .12s}
.panel:hover .rsz::before{opacity:1}
.rsz:hover::before,.rsz.on::before,.rsz:focus-visible::before{opacity:1;background:var(--accent);width:48px}
.rsz:focus-visible{outline:2px solid var(--accent);outline-offset:0}
@media (pointer:coarse){.rsz{height:22px;bottom:-11px}.rsz::before{opacity:1}}
.panel.lifted{opacity:.55;outline:2px dashed var(--accent);outline-offset:-2px;border-radius:var(--r)}
body.pdrag,body.pdrag *{cursor:grabbing!important;user-select:none}
body.prsz,body.prsz *{cursor:ns-resize!important;user-select:none}
body.pcol,body.pcol *{cursor:col-resize!important;user-select:none}
#dropLine{position:fixed;left:0;top:0;height:2px;border-radius:1px;background:var(--accent);z-index:30;pointer-events:none;display:none}
#dropLine span{position:absolute;left:10px;top:-10px;font-size:var(--fs-xs);font-weight:500;line-height:16px;background:var(--accent);color:var(--on-solid);padding:2px 8px;border-radius:var(--r-s);white-space:nowrap}
#colDiv::before{content:"";width:1px;height:100%;background:transparent}
#colDiv::after{content:"";position:absolute;top:50%;left:50%;width:4px;height:28px;margin:-14px 0 0 -2px;border-radius:2px;background:var(--line2)}
#colDiv:hover::after,#colDiv.on::after,#colDiv:focus-visible::after{background:var(--accent)}
#colDiv:hover::before,#colDiv.on::before{background:var(--line2)}
#colDiv:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* rows inside the side panels */
.lnk{cursor:pointer;border-radius:var(--r-s)}.lnk:hover,.need[role="button"]:hover,.train[role="button"]:hover{background:var(--hover)}
.need{display:flex;gap:var(--sp2);align-items:flex-start;padding:4px var(--sp1);margin:0 calc(-1*var(--sp1));border-radius:var(--r-s);font-size:var(--fs-s);color:var(--text2)}
.need .sev{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--pend)}
.need .sev.high{background:var(--fail)}.need .sev.med{background:var(--idle)}.need .sev.ok{background:var(--done)}
.need b{font-weight:600;color:var(--text);margin-right:6px}
.need span.t{overflow-wrap:anywhere;min-width:0;flex:1}
.need .rm{display:block;color:var(--muted);font-size:var(--fs-xs);font-family:var(--mono)}
.need .rm .warn{color:var(--idle)}
.need .num{flex:none;color:var(--muted);font-family:var(--mono);font-size:var(--fs-xs);margin-top:1px}
.minibtn{border:0;background:none;color:var(--muted);font-size:var(--fs-s);padding:4px 0}
.minibtn:hover{color:var(--text)}
#plan .task{display:flex;gap:var(--sp2);align-items:flex-start;padding:3px var(--sp1);margin:0 calc(-1*var(--sp1));font-size:var(--fs-m);border-radius:var(--r-s);color:var(--text)}
#plan .task:hover{background:var(--hover)}#plan .task.sel{background:var(--accent-bg)}
#plan .task .box{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);margin-top:2px;display:flex;align-items:center;justify-content:center;color:var(--done)}
#plan .task.in_progress .box{border-color:var(--run)}
#plan .task.in_progress .box::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--run)}
#plan .task.completed{color:var(--muted)}
#plan .task.completed .box{border:0}
#plan .task.completed .box .ic{width:15px;height:15px}
#plan .task.ended{color:var(--muted)}
#plan .task.auto-failed .box{border-color:var(--fail);color:var(--fail)}#plan .task.auto-failed .box .ic{width:9px;height:9px;stroke-width:3.5}
#plan .task.auto-stopped .box{border-color:var(--stop)}#plan .task.auto-stopped .box::after{content:"";width:6px;height:6px;border-radius:1px;background:var(--stop)}
#plan .stalehint{font-size:var(--fs-s);color:var(--idle);padding:0 0 var(--sp1)}
#plan .task span:nth-child(2){flex:1;overflow-wrap:anywhere}#plan .task .badge{flex:none;white-space:nowrap;margin-top:1px}
#plan .taskagent{display:flex;gap:6px;align-items:center;font-size:var(--fs-s);padding:1px var(--sp1) 1px 26px;margin:0 calc(-1*var(--sp1));border-radius:var(--r-s);min-width:0;color:var(--text2)}
#plan .taskagent .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plan .taskagent .dot{width:6px;height:6px}
#plan .stale{color:var(--idle);font-size:var(--fs-s);margin-top:var(--sp1)}
#side .agent{display:flex;gap:var(--sp2);align-items:center;font-size:var(--fs-s);padding:2px 0;min-width:0;color:var(--text2)}
#side .agent .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp2);font-size:var(--fs-s);padding:2px 0;color:var(--muted)}
.kv b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.kv b.hot{color:var(--fail)}.kv b.warm{color:var(--idle)}
.kv span.mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subh{margin:10px 0 4px;font-size:var(--fs-xs);font-weight:500;color:var(--muted)}
.top{display:grid;grid-template-columns:minmax(0,1fr) 72px 40px;align-items:center;gap:var(--sp2);font-size:var(--fs-s);padding:2px var(--sp1);margin:0 calc(-1*var(--sp1))}
.top .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:var(--fs-xs);color:var(--text2)}
.top .tb{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.top .tb i{display:block;height:100%;background:var(--muted)}
.top b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.mixrow{display:grid;grid-template-columns:64px minmax(0,1fr) 40px;align-items:center;gap:var(--sp2);font-size:var(--fs-s);color:var(--muted);padding:2px 0}

.train{padding:6px var(--sp1);margin:0 calc(-1*var(--sp1));border-radius:var(--r-s)}

.train .hd{display:flex;align-items:center;gap:var(--sp2);font-size:var(--fs-m)}

.train .hd .sp{margin-left:auto;display:flex;gap:var(--sp2);font-size:var(--fs-s);color:var(--muted)}

.train .ln .row{gap:var(--sp1) var(--sp3)}
.events{max-height:420px;overflow:auto}
#wts{max-height:260px;overflow:auto}
.ev{display:grid;grid-template-columns:38px 6px minmax(0,1fr);gap:var(--sp2);align-items:start;font-size:var(--fs-s);padding:2px 0;color:var(--text2)}
.ev time{color:var(--faint);font-family:var(--mono);font-size:var(--fs-xs);line-height:18px}

.wt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px var(--sp3);font-size:var(--fs-xs);align-items:center;font-family:var(--mono);color:var(--text2)}

@media (max-width:1049px){main>aside{display:contents}.panel{order:1}#needPanel{order:-1}#needPanel.quiet{order:1}main>section{order:0}main>aside.custom>#needPanel{order:1}#colDiv{display:none}}

/* the tree */
#treeView{position:relative;height:calc(100vh - 150px);min-height:420px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--sunk);overflow:hidden}

.tv-tools{position:absolute;top:var(--sp2);right:var(--sp2);display:flex;gap:2px;z-index:2;background:var(--panel);padding:2px;border-radius:var(--r);border:1px solid var(--line)}
.tv-tools .iconbtn{height:26px;min-width:26px}
.tv-hint{position:absolute;left:var(--sp2);bottom:var(--sp2);font-size:var(--fs-xs);color:var(--muted);z-index:2;pointer-events:none;background:var(--sunk);background:color-mix(in srgb,var(--sunk) 88%,transparent);padding:2px var(--sp2);border-radius:var(--r-s)}

.tv-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:var(--fs-m);pointer-events:none}

.tn text.t2{font:600 12.5px var(--sans)}
.tn text.t3{font:500 12px var(--sans);fill:var(--text2)}
.tn text.m{font:400 12px var(--sans);fill:var(--text2)}
.tn text.g{font:400 11px var(--mono);fill:var(--muted)}
.tn text.s{font:400 11.5px var(--sans);fill:var(--muted)}
.tn text.st{font-weight:500}.tn.lead.running text.st{fill:var(--run)}
.tn text.cnt{font:400 11.5px var(--sans);fill:var(--faint)}

.sg.running circle{fill:var(--run)}.sg.running circle.halo{fill:var(--run-bg);animation:halo 1.8s ease-in-out infinite}
.sg.idle circle{fill:var(--idle)}.sg.failed circle{fill:var(--fail)}
.sg.done path{fill:none;stroke:var(--done);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.sg circle.hollow{fill:none;stroke:var(--pend);stroke-width:1.4}

.tn .tg circle{fill:var(--panel);stroke:var(--line2);stroke-width:1}
.tn .tg text{fill:var(--muted);font:500 12px var(--sans);text-anchor:middle}
.tn .tg circle.hit{fill:transparent;stroke:none}
.tn:hover .tg circle:not(.hit){stroke:var(--muted)}

#treeSvg.far .tn text.s,#treeSvg.far .tn text.g,#treeSvg.far .tn text.m{display:none}
.tn.focus rect.box{stroke:var(--accent);stroke-width:2}

.tn.agent.loop rect.box{stroke:var(--fail);stroke-width:1.5}.tn.agent.loop text.s{fill:var(--fail)}

/* the detail drawer */

  transform:translateX(102%);visibility:hidden;transition:transform .18s,visibility 0s .18s;overflow:auto;overscroll-behavior:contain;padding:0 var(--sp5) 40px;box-shadow:var(--shadow)}

.block[role="button"]:hover{border-color:var(--line2)}
.block .arow{flex-wrap:nowrap;align-items:flex-start}
.block .arow>b{flex:1 1 0;min-width:0;overflow-wrap:anywhere;font-weight:600}
.block .arow>.dot{margin-top:6px}
.block .arow>.badge{flex:none;margin-top:1px}
.block .arow>.muted{flex:0 1 auto;max-width:40%;overflow-wrap:anywhere}
.block .muted.small{margin-top:2px}
.cmd{display:block;font-family:var(--mono);font-size:var(--fs-xs);background:var(--panel2);border-radius:var(--r-s);padding:6px var(--sp2);overflow-wrap:anywhere;user-select:all;margin-top:6px;color:var(--text2)}
.ut{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr) minmax(0,1fr);column-gap:var(--sp4);row-gap:var(--sp2);font-size:var(--fs-m);align-items:start}
.ut .hd{align-self:end;font-size:var(--fs-xs);color:var(--muted)}
.ut .hd.r,.ut .r{text-align:right}
.ut .lb{color:var(--text2)}
.ut .num{font-weight:500;font-variant-numeric:tabular-nums}

.ut .pc{height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}

.ut .pct.over{color:var(--idle)}

/* touch and narrow screens */
@media (pointer:coarse),(max-width:700px){
  button,.iconbtn,.filters button,.minibtn,.projsel{min-height:44px;min-width:44px}
  #plan .task.task{min-height:44px;align-items:flex-start;padding-top:12px;padding-bottom:12px}
  #plan .taskagent.taskagent{padding-top:10px;padding-bottom:10px;min-height:44px;align-items:center}
  .kv.lnk,.top.lnk{min-height:44px;align-items:center}
  .need{min-height:44px;padding-top:11px;padding-bottom:11px}

}

  .tv-tools.tv-tools{top:auto;bottom:var(--sp2);height:auto;align-items:center}.tv-hint{display:none}

}

  #treeView{height:62vh;min-height:360px}

  .bars{margin-left:0;flex:1 1 100%}

  .sumry p{grid-template-columns:1fr;gap:2px}

  .ucols .t{order:3;min-width:84px;text-align:right}

<body>
<header>
  <div class="hid"><h1>Agent control room</h1><div class="sub" id="meta">loading…</div></div>
  <div class="stats" id="stats"></div>
  <div class="hright">
    <div class="tools"><select id="projSel" class="projsel" hidden aria-label="Switch project" title="Other projects with a running dashboard"></select><button class="iconbtn ico" id="layoutReset" aria-label="Reset layout" title="Reset layout: the side panels' default order, heights, folds and column width"></button><button class="iconbtn ico" id="themeBtn" aria-label="Theme: auto" title="Theme: auto"></button></div>
  </div>
</header>
<div id="banners"></div>
<main>
  <section>
    <div class="toolrow"><div class="filters" id="filters"></div><div class="bars" id="bars"></div></div>
    <div id="treeView" class="wait">
      <div class="tv-empty">Waiting for the first snapshot…</div>
      <div class="tv-tools"><button class="iconbtn ico" id="tvIn" title="Zoom in" aria-label="Zoom in"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button><button class="iconbtn ico" id="tvOut" title="Zoom out" aria-label="Zoom out"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button class="iconbtn ico" id="tvFit" title="Fit: zoom out to see the whole tree" aria-label="Fit the whole tree"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button><button class="iconbtn" id="tvClear" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>Clear highlight</button></div>
      <div class="tv-hint" id="tvHint" title="Lead, then task steps, the runs each step names, their stages and agents. Runs no step names sit under &quot;Other work&quot;.">Drag to pan · scroll to zoom · click a box for details · ± folds</div>
      <svg id="treeSvg" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Agent tree. Tab to a box, Enter opens it, plus and minus fold it."><g id="vp"><g id="tvLinks" aria-hidden="true"></g><g id="tvNodes"></g></g></svg>
    </div>
  </section>
  <div id="colDiv" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Side column width" title="Drag to resize · arrow keys · double-click for the default width"></div>
  <aside id="sideCol">
    <div class="panel" id="needPanel" hidden><h2>Needs you<span class="cnt" id="needCnt"></span></h2><div id="need"></div></div>
    <div class="panel" id="planPanel" hidden><h2>Task list<span class="cnt" id="planCnt"></span></h2><div id="plan"></div></div>
    <div class="panel" id="burnPanel"><h2>Burn rate</h2><div id="burn"></div></div>
    <div class="panel" id="readyPanel" hidden><h2>Ready to merge<span class="cnt" id="readyCnt"></span></h2><div id="ready"></div></div>
    <div class="panel" id="trainPanel"><h2>Merge train</h2><div id="trains"></div></div>
    <div class="panel" id="sidePanel" hidden><h2 title="Subagents the lead started directly, outside a workflow">Side agents<span class="cnt" id="sideCnt"></span></h2><div id="side"></div></div>
    <div class="panel" id="mixPanel"><h2>Model mix</h2><div id="mix"></div></div>
    <div class="panel" id="wtsPanel"><h2>Worktrees<span class="cnt" id="wtsCnt"></span></h2><div id="wts"></div></div>
    <div class="panel" id="eventsPanel"><h2>Recent events</h2><div class="events" id="events"></div></div>
  </aside>
</main>
<div id="dropLine" aria-hidden="true"><span></span></div>
<div id="layMsg" class="sr" role="status" aria-live="polite"></div>
<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Details"></aside>

function saveScrolls() {

/* ---------- loop ---------- */
var STALE_MS = 120000, PHONE = false, pausedHint = false;
function ageText(sec) {
  if (sec < 5) return "just now";
  if (sec < 60) return sec + "s ago";
  if (sec < 5400) return Math.round(sec / 60) + " min ago";
  return (sec / 3600).toFixed(1) + " h ago";
}
function setMeta() {
  var m = clear($("meta")), age = Math.round((Date.now() - data.generated) / 1000);
  m.title = "Session " + (data.session || "none");
  m.appendChild(document.createTextNode((data.project || "").split(/[\\/]/).filter(Boolean).pop() + " \u00b7 updated "));
  m.appendChild(h("span", "age" + (age * 1000 > STALE_MS ? " stale" : ""), ageText(age)));

function tickMeta() { if (data) setMeta(); }

}
function drawAll() { drawHeader(); drawLanes(); sizeLayout(); drawTreeView(); drawNeed(); drawPlan(); drawBurn(); drawReady(); drawTrains(); drawSide(); drawMix(); drawWorktrees(); drawEvents(); if (openKey && !selectionIn($("drawer"))) { var s = $("drawer").scrollTop; drawDrawer(); $("drawer").scrollTop = s; } }
var lastRaw = "", failures = 0, dataChanged = false;
function ingest(obj, key) {

  pausedHint = false;
  if (key !== lastRaw) { lastRaw = key; data = obj; dataChanged = true; draw(); dataChanged = false; } else tickMeta();
}
function poll() {
  fetch("status.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("collecting"); return r.text(); }).then(function (t) {
    ingest(JSON.parse(t), t);

  });
}
function setTheme(t) {

  tb.appendChild(icon(t)); tb.title = "Theme: " + t + " (click for " + nextT + ")"; tb.setAttribute("aria-label", "Theme: " + t);

}
$("themeBtn").addEventListener("click", function () { setTheme(theme === "auto" ? "light" : theme === "light" ? "dark" : "auto"); });
try { setTheme(localStorage.getItem("dash-theme") || "auto"); var f = localStorage.getItem("dash-filter"); if (f === "recent" || f === "day" || f === "live" || f === "attention" || f === "all") filter = f; } catch (e) { setTheme("auto"); }
setInterval(function () { if (data) drawHeader(); }, 30000);
var hiddenAt = document.hidden ? Date.now() : 0, refreshNow = function () {};
function shown() {

  if (data) setMeta();
  refreshNow();
}
document.addEventListener("visibilitychange", function () { if (document.hidden) hiddenAt = Date.now(); else shown(); });
window.addEventListener("focus", function () { if (!document.hidden) { if (data) setMeta(); refreshNow(); } });

setInterval(function () {
  if (document.hidden && hiddenAt && Date.now() - hiddenAt > 60000) pausedHint = true;
  if (data) setMeta();
}, 5000);

// other projects with a running dashboard: listed by this server from the shared registry; choosing one opens that server
function drawProjects(list) {
  var sel = $("projSel"), me = String(location.port);
  if (!list || list.length < 2) { sel.hidden = true; return; }
  var names = {};
  list.forEach(function (p) { names[p.name] = (names[p.name] || 0) + 1; });
  clear(sel);
  list.forEach(function (p) {
    var label = (names[p.name] > 1 && p.parent ? p.parent + "/" : "") + p.name + " \u00b7 " + p.running + " running" + (p.needs ? " \u00b7 " + p.needs + " need you" : "");
    var o = h("option", "", label); o.value = String(p.port); if (String(p.port) === me) o.selected = true; sel.appendChild(o);
  });
  sel.hidden = false;
}
function pollProjects() {
  fetch("projects.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { if (j) drawProjects(j.projects); }).catch(function () {});
}
$("projSel").addEventListener("change", function () {
